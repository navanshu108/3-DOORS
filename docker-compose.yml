services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend (Local RAG + Agent Router + LanceDB)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: local-research-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      # Connect to Ollama running on host machine (outside container)
      # On Linux/macOS/Windows, host.docker.internal maps to the host via host-gateway
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:32b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - DATABASE_PATH=/app/data/vector_store
      - DOCUMENTS_PATH=/app/data/documents
      - CACHE_PATH=/app/data/cache
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - BROWSER_TIMEOUT_SECONDS=60
      - MAX_BROWSER_STEPS=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent local storage for private documents and vector embeddings
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - agent-net

  # ----------------------------------------------------------------------------
  # React + Vite Frontend (Clean Dashboard, Document Ingestion, Chat & Logs)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: local-research-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
