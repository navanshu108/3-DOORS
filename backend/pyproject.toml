[project]
name = "local-research-agent-backend"
version = "0.1.0"
description = "Local-First Autonomous Research Agent Backend with Ollama, LanceDB, and browser-use"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Local Research Agent Contributors" }
]
license = { text = "MIT" }
keywords = ["rag", "ollama", "local-llm", "lancedb", "browser-use", "research-agent"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "ollama>=0.4.0",
    "lancedb>=0.17.0",
    "pymupdf>=1.25.0",
    "browser-use>=0.1.20",
    "httpx>=0.28.0",
    "python-multipart>=0.0.19",
    "sqlalchemy>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "browser_use.*",
    "ollama.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
